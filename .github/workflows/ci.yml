name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Node 26, the version the Dockerfile ships.
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      # Generated files aren't in the tree, so codegen runs before anything reads them.
      - name: Codegen
        run: npm run codegen
      # `biome ci` runs the same checks as check:biome, but never writes.
      - name: Lint
        run: npx biome ci .
      - name: Typecheck
        run: npm run check:types
      # Tests use in-memory PGlite (vitest.config.ts), so no database service is needed.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
