# Once CI has passed on main: cuts a version from the conventional commits since the last one (semantic-release: a
# tag, a GitHub release, CHANGELOG.md and package.json's version), then pushes the image to GHCR as that version and
# `latest`. A push whose commits are all chore, docs, ci, build, refactor or test cuts no version and pushes nothing.
#
# No secrets to set: the workflow's own GITHUB_TOKEN pushes the tag, the release commit and ghcr.io/cubicecho/ravocal.
# The first time it publishes, make the package public once (the package's settings on GitHub > Change visibility).

name: Release

on:
  # After CI finishes on main, so a commit that fails its checks is never released. It fires for a failed run too,
  # which the job's `if` turns away. This must name ci.yml's `name` exactly.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Pushes the image for a version that was already released, without cutting a new one (Actions > Release > Run
  # workflow). It is built from that version's tag.
  workflow_dispatch:
    inputs:
      version:
        description: The released version to push the image for, such as 1.2.0
        required: true

# Two releases at once would both try to cut the same version. The second waits for the first; cancelling one
# mid-push would leave a tag with no image.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cubicecho/ravocal

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the tag, the GitHub release and the chore(release) commit
      issues: write # @semantic-release/github comments on the issues a release closes
      pull-requests: write # and on the pull requests it ships
      packages: write # the image on GHCR

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to find the last release and the commits since.
          fetch-depth: 0
          # The commit CI passed, not wherever main has moved since; or, by hand, the version's tag.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install semantic-release
        if: github.event_name == 'workflow_run'
        run: >-
          npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator
          @semantic-release/changelog @semantic-release/npm @semantic-release/git @semantic-release/github

      # A dry run first: when every commit since the last release is a chore, docs, ci or build, no version is cut,
      # and the image steps must not run. When main has moved on since CI ran, semantic-release releases nothing
      # here; the newer commit's own CI run releases both.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          output=$(semantic-release --dry-run 2>&1)
          echo "$output"
          version=$(echo "$output" | grep -oP 'next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$version" ]; then
            semantic-release
            echo "version=$version" >> "$GITHUB_OUTPUT"
            # The release commit, which the image is built from.
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the working tree, which semantic-release has just bumped, so /healthz reports the new version.
      # `latest` as well as the version: docker-compose.yml and the README's quickstart pull it. The Dockerfile labels
      # the image with its source, which links the package to this repository; these add what only a release knows.
      - name: Build and push to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
