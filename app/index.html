<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ravocal</title>
    <!-- Before first paint, so the page never flashes the wrong theme: the light/dark half of cubeui's
         THEME_PRE_PAINT_SCRIPT (src/components/ui/theme-preference-base.ts). Keep it in step. -->
    <script>(function(){try{var p=localStorage.getItem("cubeui-theme"),d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches),c=document.documentElement.classList;c.toggle("dark",d);c.toggle("light",p==="light")}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
