# Its own project name, so it never collides with docker-compose.yml's containers.
name: ravocal-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: ravocal, POSTGRES_PASSWORD: ravocal, POSTGRES_DB: ravocal }
    ports:
      # Loopback by default. Set DEV_BIND=0.0.0.0 when the Docker daemon is remote
      # (`docker context ls`), because 127.0.0.1 there is the daemon host's loopback.
      # 5436 rather than 5432, so this can run beside other apps' dev databases.
      - "${DEV_BIND:-127.0.0.1}:${POSTGRES_PORT:-5436}:5432"
    volumes: [ravocal_dev_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ravocal -d ravocal"], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  ravocal_dev_pgdata:
